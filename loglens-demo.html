<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogLens — SIEM Log Correlator</title>
  <meta name="description" content="Interactive SIEM log correlator. Paste auth.log or syslog output to detect brute force, privilege escalation, and lateral movement." />
  <meta name="author" content="Anfas Pulari" />
  <meta property="og:title" content="LogLens — SIEM Log Correlator" />
  <meta property="og:description" content="Client-side log correlation — detect brute force, privilege escalation, lateral movement from auth.log exports." />
  <meta property="og:type" content="website" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0e14;
      --surface:  #0d1117;
      --surface2: #161b22;
      --border:   rgba(74,222,128,0.13);
      --border2:  rgba(74,222,128,0.22);
      --green:    #4ade80;
      --green-dim:rgba(74,222,128,0.45);
      --red:      #f87171;
      --orange:   #fb923c;
      --yellow:   #facc15;
      --cyan:     #00d4ff;
      --dim:      #4a5568;
      --text:     #c9d1d9;
      --text2:    #8b949e;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      min-height: 100vh;
      line-height: 1.5;
    }

    .hdr {
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 20;
      gap: 1rem;
    }
    .hdr-brand { display: flex; align-items: center; gap: 0.6rem; }
    .hdr-logo  { font-size: 1rem; font-weight: 700; color: var(--green); letter-spacing: -0.01em; }
    .hdr-badge {
      font-size: 0.65rem; background: rgba(74,222,128,0.08);
      color: var(--green-dim); border: 1px solid var(--border);
      border-radius: 3px; padding: 2px 7px; letter-spacing: 0.06em;
    }
    .hdr-links { display: flex; align-items: center; gap: 1rem; }
    .hdr-links a {
      font-family: var(--sans); font-size: 0.8rem;
      color: var(--dim); text-decoration: none; transition: color 0.2s;
    }
    .hdr-links a:hover { color: var(--green); }
    .btn-gh {
      background: rgba(74,222,128,0.07); color: var(--green) !important;
      border: 1px solid var(--border); border-radius: 5px;
      padding: 4px 12px !important; transition: background 0.2s, border-color 0.2s !important;
    }
    .btn-gh:hover { background: rgba(74,222,128,0.14) !important; border-color: var(--green-dim) !important; }

    .page { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }

    .upload-card {
      border: 2px dashed var(--border2);
      border-radius: 10px;
      background: var(--surface);
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s;
      position: relative;
    }
    .upload-card:hover, .upload-card.drag-over {
      border-color: var(--green);
      background: rgba(74,222,128,0.04);
    }
    .upload-card.drag-over { background: rgba(74,222,128,0.07); }
    .upload-icon { margin-bottom: 1.1rem; opacity: 0.6; }
    .upload-heading {
      font-family: var(--sans); font-size: 1.05rem; font-weight: 600;
      color: #e6edf3; margin-bottom: 0.35rem;
    }
    .upload-sub   { font-size: 0.78rem; color: var(--dim); margin-bottom: 0.4rem; }
    .upload-types { font-size: 0.72rem; color: rgba(74,222,128,0.35); }
    #file-input   { display: none; }

    .paste-toggle {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin-top: 1.5rem; font-size: 0.8rem; color: var(--green-dim);
      cursor: pointer; background: none; border: none;
      font-family: var(--mono); padding: 4px 0; transition: color 0.2s;
    }
    .paste-toggle:hover { color: var(--green); }
    .paste-toggle .arrow { transition: transform 0.2s; display: inline-block; }
    .paste-toggle.open .arrow { transform: rotate(90deg); }

    .paste-section { display: none; margin-top: 1.2rem; text-align: left; }
    .paste-section.visible { display: block; }

    .paste-label {
      font-size: 0.72rem; color: var(--dim); letter-spacing: 0.05em;
      text-transform: uppercase; margin-bottom: 0.4rem; display: block;
    }

    textarea#paste-input {
      width: 100%; min-height: 180px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border2); border-radius: 6px;
      font-family: var(--mono); font-size: 0.78rem; line-height: 1.65;
      padding: 0.8rem 1rem; resize: vertical; outline: none;
      transition: border-color 0.2s;
    }
    textarea#paste-input:focus { border-color: var(--green); }
    textarea#paste-input::placeholder { color: var(--dim); opacity: 0.6; }

    .upload-actions {
      margin-top: 1.8rem; display: flex; flex-direction: column;
      align-items: center; gap: 0.7rem;
    }
    .btn-analyze {
      font-family: var(--mono); font-size: 0.85rem; font-weight: 500;
      background: var(--green); color: #0a0e14;
      border: none; border-radius: 6px; padding: 0.65rem 2.2rem;
      cursor: pointer; transition: background 0.2s, opacity 0.2s;
      letter-spacing: 0.03em;
    }
    .btn-analyze:disabled { background: rgba(74,222,128,0.15); color: var(--dim); cursor: not-allowed; }
    .btn-analyze:not(:disabled):hover { background: #6ee7a0; }

    .privacy-note {
      font-family: var(--sans); font-size: 0.72rem; color: var(--dim);
      display: flex; align-items: center; gap: 0.35rem;
    }
    .privacy-note svg { flex-shrink: 0; }

    #state-analyzing { display: none; }
    #state-report    { display: none; }

    .terminal-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
    .terminal-titlebar {
      background: var(--surface2); border-bottom: 1px solid var(--border);
      padding: 0.55rem 1rem; display: flex; align-items: center; gap: 0.45rem;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .dot-r { background: #f87171; }
    .dot-y { background: #facc15; }
    .dot-g { background: #4ade80; }
    .terminal-title { font-size: 0.7rem; color: var(--dim); margin-left: 0.45rem; letter-spacing: 0.03em; }
    .terminal-body {
      padding: 1rem 1.1rem 1.2rem;
      min-height: 300px; max-height: 680px;
      overflow-y: auto; overflow-x: hidden;
    }
    .t-line  { display: block; line-height: 1.7; white-space: pre-wrap; word-break: break-all; font-size: 0.79rem; }
    .t-blank { display: block; height: 4px; }
    .t-prompt { color: var(--green); }
    .t-step::before { content: '[+] '; color: var(--green); }
    .t-hr     { color: var(--green-dim); }
    .t-head   { color: var(--green); font-weight: 700; }
    .t-label  { color: var(--green); }
    .t-key    { color: var(--text); }
    .t-val    { color: #a5d6ff; }
    .t-red    { color: var(--red);    font-weight: 700; }
    .t-orange { color: var(--orange); font-weight: 700; }
    .t-yellow { color: var(--yellow); }
    .t-green  { color: var(--green);  font-weight: 700; }
    .t-ioc    { color: #e6edf3; }
    .t-reason::before { content: '    ! '; color: var(--yellow); }
    .t-reason { color: var(--yellow); }
    .t-error  { color: var(--red); }
    .cursor {
      display: inline-block; width: 8px; height: 13px;
      background: var(--green); vertical-align: text-bottom;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .btn-another {
      display: block; margin: 1.5rem auto 0;
      font-family: var(--mono); font-size: 0.82rem;
      background: rgba(74,222,128,0.07); color: var(--green);
      border: 1px solid var(--border2); border-radius: 6px;
      padding: 0.55rem 1.6rem; cursor: pointer;
      transition: background 0.2s; letter-spacing: 0.04em;
    }
    .btn-another:hover { background: rgba(74,222,128,0.14); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(74,222,128,0.18); border-radius: 3px; }
  </style>
</head>
<body>

  <header class="hdr">
    <div class="hdr-brand">
      <span class="hdr-logo">LogLens</span>
      <span class="hdr-badge">CORRELATOR</span>
    </div>
    <nav class="hdr-links">
      <a href="https://anfaspulari.github.io">&#8592; Portfolio</a>

    </nav>

  <main class="page">

    <div id="state-upload">
      <div class="upload-card" id="drop-zone" role="button" tabindex="0" aria-label="Upload log file">
        <input type="file" id="file-input" accept=".log,.txt" />

        <div class="upload-icon">

            <path d="M32 4v10h10" stroke="rgba(74,222,128,0.45)" stroke-width="1.5" fill="none"/>

            <textarea id="paste-input" spellcheck="false"
              placeholder="Apr 28 09:12:03 server01 sshd[1001]: Failed password for root from 185.220.101.47 port 44412 ssh2&#10;Apr 28 09:12:07 server01 sshd[1001]: Failed password for admin from 185.220.101.47 port 44413 ssh2&#10;Apr 28 09:12:11 server01 sshd[1001]: Failed password for user1 from 185.220.101.47 port 44414 ssh2&#10;Apr 28 09:13:02 server01 sshd[1002]: Accepted password for user1 from 10.0.0.15 port 52341 ssh2&#10;Apr 28 09:45:22 server01 sudo: user1 : TTY=pts/0 ; PWD=/home/user1 ; USER=root ; COMMAND=/bin/bash&#10;Apr 28 10:02:14 webserver02 sshd[2041]: Failed password for root from 203.0.113.42 port 39871 ssh2&#10;Apr 28 10:02:18 webserver02 sshd[2042]: Accepted password for root from 203.0.113.42 port 39872 ssh2&#10;Apr 28 10:15:30 server01 sshd[1103]: Accepted password for user1 from 10.0.0.5 port 54201 ssh2&#10;Apr 28 10:15:45 webserver02 sshd[2055]: Accepted password for deploy from 10.0.0.5 port 54289 ssh2&#10;Apr 28 10:15:52 dbserver03 sshd[3012]: Accepted password for postgres from 10.0.0.5 port 54301 ssh2"></textarea>

      <div class="upload-actions">

            <path d="M8 1L2 4v4c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V4L8 1z" stroke="#4a5568" stroke-width="1.3" fill="none"/>
          </svg>
          Correlated entirely in your browser &mdash; nothing is uploaded to any server.
        </p>

    </div>

    <div id="state-analyzing">
      <div class="terminal-wrap">
        <div class="terminal-titlebar">
          <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
          <span class="terminal-title" id="analyzing-title">loglens &#8212; correlating...</span>

    <div id="state-report">

          <span class="terminal-title" id="report-title">loglens &#8212; report</span>
        </div>
        <div class="terminal-body" id="terminal-report"></div>
      </div>
      <button class="btn-another" id="btn-another">&#x21BA; Correlate Another</button>

  </main>

  <script>
  'use strict';

  /* ================================================================
     UTILITIES
  ================================================================ */
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function defangIp(ip) { return String(ip).replace(/\./g,'[.]'); }

  function isPrivateIp(ip) {
    var p = ip.split('.').map(Number);
    if (p[0] === 10) return true;
    if (p[0] === 172 && p[1] >= 16 && p[1] <= 31) return true;
    if (p[0] === 192 && p[1] === 168) return true;
    if (p[0] === 127) return true;
    return false;
  }

  /* ================================================================
     LOG PARSER
  ================================================================ */
  var MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

  function parseTimestamp(ts) {
    var m = ts.match(/(\w{3})\s+(\d+)\s+(\d+):(\d+):(\d+)/);
    if (!m) return 0;
    return (MONTHS[m[1]]||0)*2678400 + parseInt(m[2])*86400
           + parseInt(m[3])*3600 + parseInt(m[4])*60 + parseInt(m[5]);
  }

  function parseSyslogLine(line) {
    var m = line.match(/^(\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(\S+)\s+(\S+?)(?:\[\d+\])?\s*:\s*(.+)$/);
    if (!m) return null;
    return {
      timestamp: m[1].replace(/\s+/g,' '),
      host:      m[2],
      process:   m[3].toLowerCase(),
      message:   m[4],
      tsVal:     parseTimestamp(m[1]),
      raw:       line
    };
  }

  function parseLog(text) {
    var lines   = text.split(/\r?\n/);
    var entries = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var e = parseSyslogLine(line);
      if (e) entries.push(e);
    }
    return { entries: entries, totalLines: lines.filter(function(l){ return l.trim(); }).length };
  }

  /* ================================================================
     DETECTION ENGINE
  ================================================================ */
  var SSH_FAIL_RE   = /Failed (?:password|publickey) for (?:invalid user )?(\S+) from (\d+\.\d+\.\d+\.\d+)/i;
  var SSH_ACCPT_RE  = /Accepted (?:password|publickey) for (\S+) from (\d+\.\d+\.\d+\.\d+)/i;
  var SUDO_MSG_RE   = /^(\S+)\s+:.*USER=(\S+)\s*;.*COMMAND=(.+)/;
  var SU_OPEN_RE    = /session opened for user (\S+) by (\w+)/i;

  function correlate(parsed) {
    var entries     = parsed.entries;
    var failsByIp   = {};
    var succsByIp   = {};
    var hostsByIp   = {};
    var anomalies   = [];
    var accounts    = {};
    var hosts       = {};

    function initAcct(u) {
      if (!accounts[u]) accounts[u] = { failed: 0, success: 0, privesc: false };
    }

    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      hosts[e.host] = true;

      var fm = e.message.match(SSH_FAIL_RE);
      if (fm) {
        var ip = fm[2], user = fm[1];
        if (!failsByIp[ip]) failsByIp[ip] = [];
        failsByIp[ip].push({ user: user, host: e.host, ts: e.timestamp, tsVal: e.tsVal });
        initAcct(user); accounts[user].failed++;
        continue;
      }

      var sm = e.message.match(SSH_ACCPT_RE);
      if (sm) {
        var ip = sm[2], user = sm[1];
        if (!succsByIp[ip]) succsByIp[ip] = [];
        succsByIp[ip].push({ user: user, host: e.host, ts: e.timestamp, tsVal: e.tsVal });
        if (!hostsByIp[ip]) hostsByIp[ip] = {};
        if (!hostsByIp[ip][e.host]) hostsByIp[ip][e.host] = e.tsVal;
        initAcct(user); accounts[user].success++;
        continue;
      }

      if (e.process === 'sudo') {
        var sudoM = e.message.match(SUDO_MSG_RE);
        if (sudoM && sudoM[2].toLowerCase() === 'root') {
          initAcct(sudoM[1]); accounts[sudoM[1]].privesc = true;
          anomalies.push({ severity:'HIGH', type:'PRIV_ESC',
            detail: sudoM[1] + ' escalated to root via sudo on ' + e.host + ' (' + e.timestamp + ')',
            score: 20, ip: null });
        }
        continue;
      }

      if (e.process === 'su') {
        var suM = e.message.match(SU_OPEN_RE);
        if (suM && suM[1].toLowerCase() === 'root') {
          initAcct(suM[2]); accounts[suM[2]].privesc = true;
          anomalies.push({ severity:'HIGH', type:'PRIV_ESC',
            detail: suM[2] + ' opened root session via su on ' + e.host + ' (' + e.timestamp + ')',
            score: 20, ip: null });
        }
        continue;
      }
    }

    // Brute force: >= 3 failed logins from same IP
    for (var ip in failsByIp) {
      var fails = failsByIp[ip];
      if (fails.length >= 3) {
        var userSeen = {}, users = [];
        for (var j = 0; j < fails.length; j++) {
          if (!userSeen[fails[j].user]) { userSeen[fails[j].user]=true; users.push(fails[j].user); }
        }
        anomalies.push({ severity:'CRITICAL', type:'BRUTE_FORCE',
          detail: ip + ' — ' + fails.length + ' failed SSH attempts targeting: ' + users.join(', '),
          score: 20, ip: ip });

        // Success after brute from same IP
        if (succsByIp[ip]) {
          var minFail = fails[0].tsVal;
          for (var j = 1; j < fails.length; j++) if (fails[j].tsVal < minFail) minFail = fails[j].tsVal;
          var succAfter = succsByIp[ip].filter(function(s){ return s.tsVal > minFail; });
          if (succAfter.length) {
            anomalies.push({ severity:'CRITICAL', type:'SUCCESS_AFTER_BRUTE',
              detail: ip + ' — login succeeded after brute force (' + succAfter[0].user + ' on ' + succAfter[0].host + ')',
              score: 30, ip: ip });
          }
        }
      }
    }

    // 1-2 fails then success (not caught by brute)
    for (var ip in succsByIp) {
      var fails = failsByIp[ip] || [];
      if (fails.length > 0 && fails.length < 3) {
        var minFail = fails[0].tsVal;
        for (var j = 1; j < fails.length; j++) if (fails[j].tsVal < minFail) minFail = fails[j].tsVal;
        var succAfter = succsByIp[ip].filter(function(s){ return s.tsVal > minFail; });
        if (succAfter.length) {
          anomalies.push({ severity:'HIGH', type:'FAIL_THEN_SUCCESS',
            detail: ip + ' — login succeeded after ' + fails.length + ' failed attempt(s) (' + succAfter[0].user + ' on ' + succAfter[0].host + ')',
            score: 15, ip: ip });
        }
      }
    }

    // Root login from external IP
    var rootIpSeen = {};
    for (var ip in succsByIp) {
      var succs = succsByIp[ip];
      for (var j = 0; j < succs.length; j++) {
        if (succs[j].user === 'root' && !isPrivateIp(ip) && !rootIpSeen[ip]) {
          rootIpSeen[ip] = true;
          anomalies.push({ severity:'CRITICAL', type:'ROOT_LOGIN_EXTERNAL',
            detail: 'Root login from external IP ' + ip + ' on ' + succs[j].host + ' (' + succs[j].ts + ')',
            score: 25, ip: ip });
        }
      }
    }

    // Lateral movement: same IP -> 3+ hosts within 5 minutes
    for (var ip in hostsByIp) {
      var hostMap  = hostsByIp[ip];
      var hostList = Object.keys(hostMap);
      if (hostList.length >= 3) {
        var times = hostList.map(function(h){ return hostMap[h]; });
        var minT = times[0], maxT = times[0];
        for (var j = 1; j < times.length; j++) {
          if (times[j] < minT) minT = times[j];
          if (times[j] > maxT) maxT = times[j];
        }
        if ((maxT - minT) <= 300) {
          anomalies.push({ severity:'HIGH', type:'LATERAL_MOVEMENT',
            detail: ip + ' — accessed ' + hostList.length + ' hosts in ' + (maxT-minT) + 's: ' + hostList.join(', '),
            score: 30, ip: ip });
        }
      }
    }

    return {
      anomalies:   anomalies,
      accounts:    accounts,
      hosts:       Object.keys(hosts),
      failsByIp:   failsByIp,
      succsByIp:   succsByIp
    };
  }

  /* ================================================================
     SCORING
  ================================================================ */
  function calculateScore(anomalies) {
    var total = 0;
    for (var i = 0; i < anomalies.length; i++) total += anomalies[i].score;
    total = Math.min(total, 100);
    var verdict, color;
    if      (total >= 71) { verdict = 'HIGH RISK — Active Attack Indicators'; color = 'red';    }
    else if (total >= 41) { verdict = 'SUSPICIOUS — Investigate Further';     color = 'yellow'; }
    else if (total >= 11) { verdict = 'LOW RISK — Minor Anomalies';           color = 'yellow'; }
    else                  { verdict = 'CLEAN — No Anomalies Detected';         color = 'green';  }
    return { total: total, verdict: verdict, color: color };
  }

  /* ================================================================
     TERMINAL RENDERER
  ================================================================ */
  function mkLine(cls, html) {
    var p = document.createElement('p');
    p.className = 't-line' + (cls ? ' ' + cls : '');
    p.innerHTML = html;
    return p;
  }
  function mkBlank() { var p = document.createElement('p'); p.className = 't-blank'; return p; }

  function appendTo(el, node) { el.appendChild(node); el.scrollTop = el.scrollHeight; }

  function addLines(el, nodes, ms, done) {
    var i = 0;
    function next() {
      if (i >= nodes.length) { if (done) done(); return; }
      appendTo(el, nodes[i++]);
      setTimeout(next, ms);
    }
    next();
  }

  /* ================================================================
     REPORT BUILDER
  ================================================================ */
  var HR1 = '  ══════════════════════════════════════════════════════';
  var HR2 = '  ──────────────────────────────────────────────────────';

  function sevHtml(sev) {
    if (sev === 'CRITICAL') return '<span class="t-red">[CRITICAL]</span> ';
    if (sev === 'HIGH')     return '<span class="t-orange">[HIGH]    </span> ';
    if (sev === 'MEDIUM')   return '<span class="t-yellow">[MEDIUM]  </span> ';
    return '<span class="t-val">[INFO]    </span> ';
  }

  function kv(key, val) {
    return mkLine('', '<span class="t-key">' + escHtml(key) + '</span><span class="t-val">' + escHtml(val) + '</span>');
  }

  function buildReport(filename, parsed, result, scoreObj) {
    var E         = escHtml;
    var entries   = parsed.entries;
    var anomalies = result.anomalies;
    var accounts  = result.accounts;
    var hosts     = result.hosts;
    var failsByIp = result.failsByIp;
    var succsByIp = result.succsByIp;
    var nodes = [];
    var B = mkBlank;

    var totalFailed = 0, totalSuccess = 0, totalPrivesc = 0;
    for (var ip in failsByIp) totalFailed  += failsByIp[ip].length;
    for (var ip in succsByIp) totalSuccess += succsByIp[ip].length;
    for (var u  in accounts)  if (accounts[u].privesc) totalPrivesc++;

    var firstTs = entries.length ? entries[0].timestamp : 'N/A';
    var lastTs  = entries.length ? entries[entries.length-1].timestamp : 'N/A';

    // Header
    nodes.push(B());
    nodes.push(mkLine('t-hr',   E(HR1)));
    nodes.push(mkLine('t-head', '  LOGLENS CORRELATION REPORT'));
    nodes.push(mkLine('t-hr',   E(HR1)));
    nodes.push(B());

    // Log summary
    nodes.push(mkLine('t-label', '  LOG SUMMARY'));
    nodes.push(mkLine('t-label', '  ───────────'));
    nodes.push(kv('  Source    ', ' ' + filename));
    nodes.push(kv('  Entries   ', ' ' + entries.length + ' parsed'));
    nodes.push(kv('  Timespan  ', ' ' + firstTs + ' → ' + lastTs));
    nodes.push(kv('  Hosts     ', ' ' + (hosts.length ? hosts.join(', ') : 'none')));
    nodes.push(B());

    // Auth events
    nodes.push(mkLine('t-label', '  AUTHENTICATION EVENTS'));
    nodes.push(mkLine('t-label', '  ──────────────────────'));
    nodes.push(mkLine('', '<span class="t-key">  Successful logins  </span><span class="t-green"> ' + E(String(totalSuccess)) + '</span>'));
    nodes.push(mkLine('', '<span class="t-key">  Failed attempts    </span><span class="' + (totalFailed > 0 ? 't-red' : 't-green') + '"> ' + E(String(totalFailed)) + '</span>'));
    nodes.push(mkLine('', '<span class="t-key">  Privilege changes  </span><span class="' + (totalPrivesc > 0 ? 't-orange' : 't-green') + '"> ' + E(String(totalPrivesc)) + '</span>'));
    nodes.push(B());

    // Anomalies
    nodes.push(mkLine('t-label', '  ANOMALIES DETECTED (' + anomalies.length + ')'));
    nodes.push(mkLine('t-label', '  ──────────────────────────────'));
    if (!anomalies.length) {
      nodes.push(mkLine('t-green', '    None detected'));
    } else {
      for (var i = 0; i < anomalies.length; i++) {
        var a = anomalies[i];
        nodes.push(mkLine('', '  ' + sevHtml(a.severity) + E(a.detail)));
      }
    }
    nodes.push(B());

    // Suspicious IPs
    var suspIps = [], ipSeen2 = {};
    for (var i = 0; i < anomalies.length; i++) {
      if (anomalies[i].ip && !ipSeen2[anomalies[i].ip]) {
        ipSeen2[anomalies[i].ip] = true; suspIps.push(anomalies[i].ip);
      }
    }
    if (suspIps.length) {
      nodes.push(mkLine('t-label', '  SUSPICIOUS IPs'));
      nodes.push(mkLine('t-label', '  ──────────────'));
      for (var i = 0; i < suspIps.length; i++) {
        var ip     = suspIps[i];
        var fCount = (failsByIp[ip] || []).length;
        var sCount = (succsByIp[ip] || []).length;
        var note   = [];
        if (fCount) note.push(fCount + ' failed');
        if (sCount) note.push(sCount + ' accepted');
        if (!isPrivateIp(ip)) note.push('external');
        nodes.push(mkLine('t-ioc', '    ' + E(defangIp(ip)) + (note.length ? '   (' + note.join(', ') + ')' : '')));
      }
      nodes.push(B());
    }

    // Targeted accounts
    var acctList = Object.keys(accounts).filter(function(u) {
      return accounts[u].failed + accounts[u].success > 0;
    });
    if (acctList.length) {
      nodes.push(mkLine('t-label', '  TARGETED ACCOUNTS'));
      nodes.push(mkLine('t-label', '  ─────────────────'));
      for (var i = 0; i < acctList.length; i++) {
        var u = acctList[i], a = accounts[u], parts = [];
        if (a.failed)  parts.push(a.failed  + ' failed');
        if (a.success) parts.push(a.success + ' accepted');
        if (a.privesc) parts.push('PRIV_ESC');
        var cls = (a.privesc || (a.failed > 0 && a.success > 0)) ? 't-yellow' : '';
        nodes.push(mkLine(cls, '    ' + E(u) + '   (' + parts.join(', ') + ')'));
      }
      nodes.push(B());
    }

    // Score
    var sCls   = scoreObj.color === 'red' ? 't-red' : scoreObj.color === 'yellow' ? 't-yellow' : 't-green';
    var filled = Math.round(scoreObj.total / 5);
    var bar    = '█'.repeat(filled) + '░'.repeat(20 - filled);
    nodes.push(mkLine('t-hr', E(HR2)));
    nodes.push(mkLine('', '<span class="t-key">  Score   : </span><span class="' + sCls + '">' + E(String(scoreObj.total)) + '/100</span>  <span class="' + sCls + '">[' + E(bar) + ']</span>'));
    nodes.push(mkLine('', '<span class="t-key">  Verdict : </span><span class="' + sCls + '">' + E(scoreObj.verdict) + '</span>'));
    nodes.push(mkLine('t-hr', E(HR2)));
    nodes.push(B());

    // Detection reasons
    if (anomalies.length) {
      nodes.push(mkLine('t-label', '  DETECTION REASONS'));
      nodes.push(mkLine('t-label', '  ─────────────────'));
      for (var i = 0; i < anomalies.length; i++) {
        var a = anomalies[i];
        nodes.push(mkLine('t-reason', E('[' + a.type + '] ' + a.detail + '  (+' + a.score + ')')));
      }
      nodes.push(B());
    }

    return nodes;
  }

  /* ================================================================
     ORCHESTRATOR
  ================================================================ */
  var currentFilename = '';
  var currentText     = '';

  var stateUpload    = document.getElementById('state-upload');
  var stateAnalyzing = document.getElementById('state-analyzing');
  var stateReport    = document.getElementById('state-report');
  var termAnalyzing  = document.getElementById('terminal-analyzing');
  var termReport     = document.getElementById('terminal-report');
  var analyzingTitle = document.getElementById('analyzing-title');
  var reportTitle    = document.getElementById('report-title');
  var btnAnalyze     = document.getElementById('btn-analyze');
  var btnAnother     = document.getElementById('btn-another');
  var fileInput      = document.getElementById('file-input');
  var dropZone       = document.getElementById('drop-zone');
  var pasteToggle    = document.getElementById('paste-toggle');
  var pasteSection   = document.getElementById('paste-section');
  var pasteInput     = document.getElementById('paste-input');

  function showState(name) {
    stateUpload.style.display    = name === 'upload'    ? 'block' : 'none';
    stateAnalyzing.style.display = name === 'analyzing' ? 'block' : 'none';
    stateReport.style.display    = name === 'report'    ? 'block' : 'none';
  }
  showState('upload');

  dropZone.addEventListener('click', function(e) {
    if (e.target === pasteToggle || pasteSection.contains(e.target)) return;
    fileInput.click();
  });
  dropZone.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  dropZone.addEventListener('dragover',  function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', function()  { dropZone.classList.remove('drag-over'); });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function() { if (fileInput.files.length) handleFile(fileInput.files[0]); });
  pasteInput.addEventListener('input', updateBtn);
  pasteInput.addEventListener('paste', function() { setTimeout(updateBtn, 10); });
  pasteToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    var open = pasteSection.classList.toggle('visible');
    pasteToggle.classList.toggle('open', open);
    updateBtn();
  });

  function updateBtn() {
    btnAnalyze.disabled = !(pasteInput.value.trim() || currentFilename);
  }

  function handleFile(file) {
    currentFilename = file.name;
    var reader = new FileReader();
    reader.onload  = function(e) { currentText = e.target.result; updateBtn(); };
    reader.onerror = function()  { currentFilename = ''; currentText = ''; updateBtn(); };
    reader.readAsText(file, 'utf-8');
  }

  btnAnalyze.addEventListener('click', function() {
    var rawText, filename;
    if (pasteSection.classList.contains('visible') && pasteInput.value.trim()) {
      rawText = pasteInput.value; filename = '(pasted input)';
    } else {
      rawText = currentText; filename = currentFilename;
    }
    if (!rawText) return;
    runAnalysis(rawText, filename);
  });

  btnAnother.addEventListener('click', function() {
    currentFilename = ''; currentText = '';
    fileInput.value = ''; pasteInput.value = '';
    pasteSection.classList.remove('visible'); pasteToggle.classList.remove('open');
    btnAnalyze.disabled = true;
    termAnalyzing.innerHTML = ''; termReport.innerHTML = '';
    showState('upload');
  });

  function runAnalysis(rawText, filename) {
    termAnalyzing.innerHTML = ''; termReport.innerHTML = '';
    analyzingTitle.textContent = 'loglens — ' + filename;
    showState('analyzing');

    appendTo(termAnalyzing, mkLine('', '<span class="t-prompt">anfas@sec:~$</span> loglens ' + escHtml(filename)));
    appendTo(termAnalyzing, mkBlank());

    var steps = [
      'Parsing log entries...',
      'Building authentication timeline...',
      'Detecting brute force patterns...',
      'Checking privilege escalations...',
      'Identifying lateral movement...',
      'Scoring risk indicators...'
    ];
    var si = 0;
    function nextStep() {
      if (si >= steps.length) { doAnalysis(); return; }
      appendTo(termAnalyzing, mkLine('t-step', steps[si++]));
      setTimeout(nextStep, 300);
    }
    setTimeout(nextStep, 200);

    function doAnalysis() {
      setTimeout(function() {
        try {
          var parsed = parseLog(rawText);
          if (!parsed.entries.length) throw new Error('No valid syslog entries found. Ensure the log uses standard format: Month Day HH:MM:SS host process[pid]: message');
          var result   = correlate(parsed);
          var scoreObj = calculateScore(result.anomalies);

          var reportNodes = buildReport(filename, parsed, result, scoreObj);
          reportNodes.push(mkLine('', '<span class="t-prompt">anfas@sec:~$</span> <span class="cursor"></span>'));

          var clone = termAnalyzing.cloneNode(true);
          while (clone.firstChild) termReport.appendChild(clone.firstChild);

          reportTitle.textContent = 'loglens — ' + filename + ' [' + scoreObj.verdict + ']';
          showState('report');
          addLines(termReport, reportNodes, 15);
        } catch(err) {
          var msg = err && err.message ? err.message : String(err);
          appendTo(termAnalyzing, mkLine('t-error', escHtml('[!] Error: ' + msg)));
          appendTo(termAnalyzing, mkLine('', '<span class="t-prompt">anfas@sec:~$</span> <span class="cursor"></span>'));
          showState('analyzing');
        }
      }, 400);
    }
  }

  </script>
</body>
